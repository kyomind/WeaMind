name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

    steps:
      - uses: actions/checkout@v7  # Official GitHub action, keep version tag

      - name: Install dependencies
        # Ensure pyproject.toml / lockfile include pytest-cov, coverage and other dev deps
        run: uv sync --locked

      - name: Install git and other tools
        run: apt-get update && apt-get install -y git curl gnupg libatomic1

      - name: Lint (ruff)
        run: uv run ruff check . --fix

      - name: Format (ruff format)
        run: uv run ruff format .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Security scan (Bandit)
        run: uv run bandit -c bandit.yaml -r app

      - name: Dependency vulnerability scan (pip-audit)
        run: uv run pip-audit --progress-spinner=off

      - name: Run unit tests with coverage
        # Run tests and generate coverage.xml with pytest-cov
        run: |
          uv run pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        # Dependabot pull_request runs cannot access CODECOV_TOKEN on protected branches.
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5

        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  docker-build-validate:
    name: Validate Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7  # Official GitHub action, keep version tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.3.0 - Third-party action, pinned to commit SHA

      - name: Build Docker image (validation only)
        run: |
          docker buildx build \
            --file Dockerfile \
            --tag weamind-ci-test:${{ github.sha }} \
            --progress=plain \
            --load .
