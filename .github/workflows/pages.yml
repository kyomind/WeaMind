name: Deploy diagram to Pages

# Publishes only docs/site/ (the architecture diagram), not the rest of docs/.
# Mirrors weamind-infra/.github/workflows/pages.yml.
on:
  push:
    branches: [main]
    paths: ["docs/site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v5
