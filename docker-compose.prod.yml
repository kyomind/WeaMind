services:
  app:
    # Keep prod app disabled by default (production app runs on k3s); opt in with `--profile app` for one-off tasks
    profiles:
      - app
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
      - --proxy-headers
      - --loop
      - uvloop
      - --http
      - httptools
    environment:
      - ENV=production
    container_name: wea-app-prod
    restart: always
    volumes:
      - ./logs:/code/logs # Bind mount logs directory (比照 dev)
  db:
    container_name: wea-db-prod
    restart: always
    volumes:
      - wea-db-data-prod:/var/lib/postgresql/data
  redis:
    container_name: wea-redis-prod
    restart: always
    # Require ACL authentication; see redis/README.md for the aclfile format
    command: ["redis-server", "--aclfile", "/usr/local/etc/redis/users.acl"]
    ports:
      - "10.0.0.2:6379:6379"
    volumes:
      - wea-redis-data-prod:/data
      # Host-local aclfile kept outside the repo; fail instead of creating a directory if missing
      - type: bind
        source: /etc/weamind/redis/users.acl
        target: /usr/local/etc/redis/users.acl
        read_only: true
        bind:
          create_host_path: false

volumes:
  wea-db-data-prod:
    external: true
  wea-redis-data-prod:
    external: true
